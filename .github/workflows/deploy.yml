name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python
        run: python -m py_compile backend.py frontend.py chat.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Validate Docker Compose
        env:
          KEY_VAULT_NAME: validation-vault
          AZURE_CLIENT_ID: 00000000-0000-0000-0000-000000000000
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: validation
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openrouter-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/openrouter-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push chatbot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.chatbot
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openrouter-chatbot:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/openrouter-chatbot:latest
          cache-from: type=gha,scope=chatbot
          cache-to: type=gha,mode=max,scope=chatbot

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy exact image tag to Azure VM
        uses: azure/cli@v2
        with:
          inlineScript: |
            deployment_output=$(az vm run-command invoke \
              --resource-group openrouter-stage5-rg \
              --name openrouter-vm \
              --command-id RunShellScript \
              --scripts "set -e
              runuser -u azureuser -- git -C /home/azureuser/Openrouter pull --ff-only origin main
              chmod +x /home/azureuser/Openrouter/update_app.sh
              /home/azureuser/Openrouter/update_app.sh '${{ secrets.DOCKERHUB_USERNAME }}' '${{ github.sha }}'" \
              --query "value[0].message" \
              --output tsv)
            echo "$deployment_output"
